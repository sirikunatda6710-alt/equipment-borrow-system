<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ตั้งรหัสผ่านใหม่ | ระบบยืม-คืนอุปกรณ์
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


    <div class="login-container">


        <!-- โลโก้ -->

        <div class="logo">

            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >

        </div>


        <!-- หัวข้อ -->

        <h1>
            ตั้งรหัสผ่านใหม่
        </h1>


        <p class="subtitle">

            กรอกอีเมลและตั้งรหัสผ่านใหม่ที่ต้องการ

        </p>


        <!-- ฟอร์มตั้งรหัสผ่านใหม่ -->

        <form
            id="forgotPasswordForm"
            class="login-form"
        >


            <!-- อีเมล -->

            <label for="forgotEmail">

                อีเมล

            </label>


            <input
                type="email"
                id="forgotEmail"
                placeholder="กรอกอีเมลที่ใช้สมัครสมาชิก"
                required
            >


            <!-- รหัสผ่านใหม่ -->

            <label for="newPassword">

                รหัสผ่านใหม่

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="newPassword"
                    placeholder="กรอกรหัสผ่านใหม่"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="toggleNewPassword"
                >

                    แสดง

                </button>


            </div>


            <!-- เงื่อนไขรหัสผ่าน -->

            <div class="password-rules">

                <p>

                    <strong>
                        เงื่อนไขรหัสผ่าน:
                    </strong>

                </p>


                <p>
                    • อย่างน้อย 8 ตัวอักษร
                </p>


                <p>
                    • มีตัวพิมพ์ใหญ่อย่างน้อย 1 ตัว
                </p>


                <p>
                    • มีตัวพิมพ์เล็กอย่างน้อย 1 ตัว
                </p>


                <p>
                    • มีตัวเลขอย่างน้อย 1 ตัว
                </p>


            </div>


            <!-- ยืนยันรหัสผ่านใหม่ -->

            <label for="confirmNewPassword">

                ยืนยันรหัสผ่านใหม่

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="ยืนยันรหัสผ่านใหม่"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmNewPassword"
                >

                    แสดง

                </button>


            </div>


            <!-- ปุ่มตั้งรหัสผ่านใหม่ -->

            <button
                type="submit"
                class="login-button"
            >

                ตั้งรหัสผ่านใหม่

            </button>


            <!-- กลับเข้าสู่ระบบ -->

            <div class="back-login">

                <a href="index.html">

                    ← กลับเข้าสู่หน้าเข้าสู่ระบบ

                </a>

            </div>


        </form>


    </div>


    <!-- JavaScript -->
<script src="app.js"></script>
<link rel="stylesheet" href="style.css">

</body>

</html>
