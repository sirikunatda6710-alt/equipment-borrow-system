<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #409243;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .forgot-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        .forgot-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0fdf4;
            border-radius: 50%;
            padding: 8px;
        }

        .forgot-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .forgot-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2e7d32;
            margin: 0 0 0.5rem;
        }

        .forgot-subtitle {
            font-size: 0.875rem;
            color: #6b7280;
            margin: 0 0 1.75rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #246527;
        }

        .btn-submit:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.25rem;
            color: #2e7d32;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="forgot-card">
        <div class="forgot-logo">
            <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
        </div>

        <h1 class="forgot-title">ลืมรหัสผ่าน</h1>
        <p class="forgot-subtitle">กรอกอีเมลเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="forgotEmail">อีเมล</label>
                <input type="email" id="forgotEmail" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <button type="submit" class="btn-submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
        </form>

        <div>
            <a href="index.html" class="back-link">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
