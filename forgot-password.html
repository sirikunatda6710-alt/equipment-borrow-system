<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
        </div>

        <h1 class="auth-title">ลืมรหัสผ่าน</h1>
        <p class="auth-subtitle">กรอกอีเมลเพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="forgotEmail">อีเมล</label>
                <input type="email" id="forgotEmail" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.25rem; text-align: center;">
            <a href="index.html" class="link-btn">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
</body>

</html>
