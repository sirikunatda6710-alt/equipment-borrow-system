<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ตั้งรหัสผ่านใหม่ | ระบบยืม-คืนอุปกรณ์
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


    <div class="login-container">


        <!-- โลโก้ -->

        <div class="logo">

            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >

        </div>


        <!-- หัวข้อ -->

        <h1>
            ตั้งรหัสผ่านใหม่
        </h1>


        <p class="subtitle">

            กรุณาสร้างรหัสผ่านใหม่

        </p>


        <!-- ฟอร์ม -->

        <form
            id="resetPasswordForm"
            class="login-form"
        >


            <!-- รหัสผ่านใหม่ -->

            <label for="newPassword">

                รหัสผ่านใหม่

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="newPassword"
                    placeholder="กรอกรหัสผ่านใหม่"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="toggleNewPassword"
                >

                    แสดง

                </button>


            </div>


            <!-- เงื่อนไขรหัสผ่าน -->

            <div class="password-rules">


                <p>

                    <strong>
                        รหัสผ่านต้องมี:
                    </strong>

                </p>


                <p
                    id="resetRuleLength"
                    class="rule-invalid"
                >

                    อย่างน้อย 8 ตัวอักษร

                </p>


                <p
                    id="resetRuleUppercase"
                    class="rule-invalid"
                >

                    ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่

                </p>


                <p
                    id="resetRuleLowercase"
                    class="rule-invalid"
                >

                    ตัวอักษรภาษาอังกฤษพิมพ์เล็ก

                </p>


                <p
                    id="resetRuleNumber"
                    class="rule-invalid"
                >

                    ตัวเลขอย่างน้อย 1 ตัว

                </p>


            </div>


            <!-- ยืนยันรหัสผ่าน -->

            <label for="confirmNewPassword">

                ยืนยันรหัสผ่านใหม่

            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmNewPassword"
                >

                    แสดง

                </button>


            </div>


            <!-- ปุ่มบันทึก -->

            <button
                type="submit"
                class="login-button"
            >

                บันทึกรหัสผ่านใหม่

            </button>


            <!-- กลับ Login -->

            <p class="register-link">

                <a href="index.html">

                    กลับไปหน้าเข้าสู่ระบบ

                </a>

            </p>


        </form>


    </div>


    <!-- JavaScript -->

  <script src="app.js"></script>
<link rel="stylesheet" href="style.css">

</body>

</html>
