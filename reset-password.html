<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ตั้งรหัสผ่านใหม่ | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- โลโก้ -->
        <div class="login-logo">
            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >
        </div>

        <!-- หัวข้อ -->
        <h1>ตั้งรหัสผ่านใหม่</h1>

        <p class="login-subtitle">
            กำหนดรหัสผ่านใหม่สำหรับบัญชีของคุณ
        </p>

        <!-- แบบฟอร์มตั้งรหัสผ่านใหม่ -->
        <form
            id="resetPasswordForm"
            class="login-form"
        >

            <!-- อีเมล -->
            <label for="resetEmail">
                อีเมล
            </label>

            <input
                id="resetEmail"
                type="email"
                readonly
            >

            <!-- รหัสผ่านใหม่ -->
            <label for="newPassword">
                รหัสผ่านใหม่
            </label>

            <div class="password-wrapper">

                <input
                    id="newPassword"
                    type="password"
                    required
                    placeholder="สร้างรหัสผ่านใหม่"
                >

                <button
                    type="button"
                    class="toggle-password"
                >
                    แสดง
                </button>

            </div>

            <!-- เงื่อนไขรหัสผ่าน -->
            <div class="password-rules">

                <p>
                    <b>รหัสผ่านต้องมี:</b>
                </p>

                <p
                    id="resetRuleLength"
                    class="rule-invalid"
                >
                    อย่างน้อย 8 ตัวอักษร
                </p>

                <p
                    id="resetRuleUppercase"
                    class="rule-invalid"
                >
                    ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่
                </p>

                <p
                    id="resetRuleLowercase"
                    class="rule-invalid"
                >
                    ตัวอักษรภาษาอังกฤษพิมพ์เล็ก
                </p>

                <p
                    id="resetRuleNumber"
                    class="rule-invalid"
                >
                    ตัวเลขอย่างน้อย 1 ตัว
                </p>

            </div>

            <!-- ยืนยันรหัสผ่านใหม่ -->
            <label for="confirmNewPassword">
                ยืนยันรหัสผ่านใหม่
            </label>

            <div class="password-wrapper">

                <input
                    id="confirmNewPassword"
                    type="password"
                    required
                    placeholder="กรอกอีกครั้ง"
                >

                <button
                    type="button"
                    class="toggle-password"
                >
                    แสดง
                </button>

            </div>

            <!-- ปุ่มเปลี่ยนรหัสผ่าน -->
            <button
                type="submit"
                class="login-button"
            >
                เปลี่ยนรหัสผ่าน
            </button>

        </form>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
