<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 1. จัดโครงสร้างและสีพื้นหลังของทั้งหน้า */
        body.login-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2d7a3a; /* สีพื้นหลังโทนเขียว */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* 2. การ์ดคอนเทนเนอร์ตรงกลาง */
        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 2.25rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            margin: 1rem;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .login-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .login-container h1 {
            text-align: center;
            margin: 0 0 0.25rem 0;
            color: #2d7a3a; /* สีหัวข้อหลัก */
            font-size: 1.75rem;
            font-weight: 700;
        }

        .login-subtitle {
            text-align: center;
            margin: 0 0 1.25rem 0;
            color: #6b7280;
            font-size: 0.88rem;
        }

        /* 3. ฟอร์มและอินพุต */
        .login-form label {
            display: block;
            margin-bottom: 0.4rem;
            margin-top: 1rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .login-form input[type="email"],
        .password-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s ease;
        }

        .login-form input[readonly] {
            background-color: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
        }

        .password-wrapper input:focus {
            border-color: #2d7a3a;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            background: #2d7a3a;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .toggle-password:hover {
            background-color: #225e2d;
        }

        /* 4. กล่องเงื่อนไขรหัสผ่าน */
        .password-rules {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
            font-size: 0.83rem;
        }

        .password-rules p {
            margin: 0.2rem 0;
            color: #6b7280;
        }

        .password-rules .rule-valid {
            color: #2d7a3a;
            font-weight: 600;
        }

        .password-rules .rule-invalid {
            color: #dc2626;
        }

        /* 5. ปุ่มเปลี่ยนรหัสผ่าน */
        .login-button {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1.5rem;
            background-color: #2d7a3a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .login-button:hover {
            background-color: #225e2d;
        }
    </style>
</head>

<body class="login-page">

    <div class="login-container">

        <!-- โลโก้ -->
        <div class="login-logo">
            <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
        </div>

        <!-- หัวข้อ -->
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p class="login-subtitle">กำหนดรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>

        <!-- แบบฟอร์มตั้งรหัสผ่านใหม่ -->
        <form id="resetPasswordForm" class="login-form">

            <!-- อีเมล -->
            <label for="resetEmail">อีเมล</label>
            <input id="resetEmail" type="email" readonly placeholder="อีเมลของคุณ...">

            <!-- รหัสผ่านใหม่ -->
            <label for="newPassword">รหัสผ่านใหม่</label>
            <div class="password-wrapper">
                <input id="newPassword" type="password" required placeholder="สร้างรหัสผ่านใหม่">
                <button type="button" class="toggle-password">แสดง</button>
            </div>

            <!-- เงื่อนไขรหัสผ่าน -->
            <div class="password-rules">
                <p><b>รหัสผ่านต้องมี:</b></p>
                <p id="resetRuleLength" class="rule-invalid">อย่างน้อย 8 ตัวอักษร</p>
                <p id="resetRuleUppercase" class="rule-invalid">ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่</p>
                <p id="resetRuleLowercase" class="rule-invalid">ตัวอักษรภาษาอังกฤษพิมพ์เล็ก</p>
                <p id="resetRuleNumber" class="rule-invalid">ตัวเลขอย่างน้อย 1 ตัว</p>
            </div>

            <!-- ยืนยันรหัสผ่านใหม่ -->
            <label for="confirmNewPassword">ยืนยันรหัสผ่านใหม่</label>
            <div class="password-wrapper">
                <input id="confirmNewPassword" type="password" required placeholder="กรอกอีกครั้ง">
                <button type="button" class="toggle-password">แสดง</button>
            </div>

            <!-- ปุ่มเปลี่ยนรหัสผ่าน -->
            <button type="submit" class="login-button">เปลี่ยนรหัสผ่าน</button>

        </form>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
