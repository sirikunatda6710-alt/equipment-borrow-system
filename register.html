<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.auth-page {
            background-color: #409243;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        .auth-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0fdf4;
            border-radius: 50%;
            padding: 8px;
            box-sizing: border-box;
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2e7d32;
            margin: 0 0 0.25rem;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: #6b7280;
            margin: 0 0 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #2e7d32;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: #246527;
        }

        .link-btn {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
        }

        .link-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <img src="https://img2.pic.in.th/MED_logo1-1.png" alt="โลโก้คณะ">
        </div>

        <h1 class="auth-title">สมัครสมาชิก</h1>
        <p class="auth-subtitle">สร้างบัญชีผู้ใช้สำหรับระบบยืม-คืนอุปกรณ์</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="regName">ชื่อ - นามสกุล</label>
                <input type="text" id="regName" placeholder="กรอกชื่อ-นามสกุล" required>
            </div>

            <div class="form-group">
                <label for="regEmail">อีเมล</label>
                <input type="email" id="regEmail" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <div class="form-group">
                <label for="regPassword">รหัสผ่าน</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                    <button type="button" class="toggle-password">แสดง</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">ยืนยันการสมัครสมาชิก</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.25rem; text-align: center;">
            <p style="font-size: 0.875rem; color: #6b7280;">มีบัญชีอยู่แล้ว? <a href="index.html" class="link-btn" style="font-weight: 600;">เข้าสู่ระบบ</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
