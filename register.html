<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ลงทะเบียน | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="login-page">

    <div class="login-container">

        <!-- โลโก้ -->
      <div class="logo">
    <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
</div>
        <!-- หัวข้อ -->
        <h1>
            ลงทะเบียน
        </h1>

        <p class="subtitle">
            สร้างบัญชีเพื่อใช้งานระบบยืม-คืนอุปกรณ์
        </p>


        <!-- ฟอร์มลงทะเบียน -->
        <form id="registerForm" class="login-form">


            <!-- ชื่อ-นามสกุล -->
            <label for="name">
                ชื่อ-นามสกุล
            </label>

            <input
                type="text"
                id="name"
                placeholder="กรอกชื่อ-นามสกุล"
                required
            >


            <!-- อีเมล -->
            <label for="email">
                อีเมล
            </label>

            <input
                type="email"
                id="email"
                placeholder="กรอกอีเมลของคุณ"
                required
            >


            <!-- รหัสผ่าน -->
            <label for="password">
                รหัสผ่าน
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="สร้างรหัสผ่าน"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >
                    แสดง
                </button>

            </div>


            <!-- เงื่อนไขรหัสผ่าน -->
            <div class="password-rules">

                <p>
                    <strong>
                        รหัสผ่านต้องมี:
                    </strong>
                </p>

                <p id="ruleLength" class="rule-invalid">
                    อย่างน้อย 8 ตัวอักษร
                </p>

                <p id="ruleUppercase" class="rule-invalid">
                    ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่
                </p>

                <p id="ruleLowercase" class="rule-invalid">
                    ตัวอักษรภาษาอังกฤษพิมพ์เล็ก
                </p>

                <p id="ruleNumber" class="rule-invalid">
                    ตัวเลขอย่างน้อย 1 ตัว
                </p>

            </div>


            <!-- ยืนยันรหัสผ่าน -->
            <label for="confirmPassword">
                ยืนยันรหัสผ่าน
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmPassword"
                >
                    แสดง
                </button>

            </div>


            <!-- ปุ่มลงทะเบียน -->
            <button
                type="submit"
                class="login-button"
            >
                ลงทะเบียน
            </button>


            <!-- กลับไปหน้า Login -->
            <p class="register-link">

                มีบัญชีอยู่แล้ว?

                <a href="index.html">
                    เข้าสู่ระบบ
                </a>

            </p>

        </form>

    </div>


    <!-- JavaScript -->
    <script src="css/js/app.js"></script>

</body>

</html>
