<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.auth-page {
            background-color: #2e7d32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem 0;
            font-family: system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.25rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0fdf4;
            border-radius: 50%;
            padding: 8px;
            box-sizing: border-box;
        }

        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2e7d32;
            margin: 0 0 0.25rem;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: #6b7280;
            margin: 0 0 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.15rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #2e7d32;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .password-rules {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 0.9rem;
            margin-top: 0.5rem;
            text-align: left;
        }

        .password-rules ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .password-rules li {
            font-size: 0.8rem;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.25rem;
            transition: color 0.2s;
        }

        .password-rules li:last-child {
            margin-bottom: 0;
        }

        .password-rules li.valid {
            color: #16a34a;
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: #246527;
        }

        .link-btn {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }

        .link-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/MED_logo1.png/1920px-MED_logo1.png?utm_source=th.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail">
        </div>

        <h1 class="auth-title">สมัครสมาชิก</h1>
        <p class="auth-subtitle">สร้างบัญชีผู้ใช้สำหรับระบบยืม-คืนอุปกรณ์</p>

        <form id="registerForm">
            <!-- 1. ชื่อ - นามสกุล -->
            <div class="form-group">
                <label for="regName">ชื่อ - นามสกุล</label>
                <input type="text" id="regName" placeholder="กรอกชื่อ-นามสกุล" required>
            </div>

            <!-- 2. อีเมล -->
            <div class="form-group">
                <label for="regEmail">อีเมล</label>
                <input type="email" id="regEmail" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <!-- 3. ประเภทผู้สมัคร -->
            <div class="form-group">
                <label for="regRole">ประเภทผู้สมัคร</label>
                <select id="regRole" required>
                    <option value="user" selected>ผู้ใช้งานทั่วไป</option>
                    <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                </select>
            </div>

            <!-- 4. รหัสยืนยันผู้ดูแลระบบ (จะแสดงเฉพาะเมื่อเลือก Admin) -->
            <div class="form-group" id="regAdminCodeGroup" style="display: none;">
                <label for="regAdminCode">รหัสยืนยันผู้ดูแลระบบ (Admin Code)</label>
                <input type="password" id="regAdminCode" placeholder="กรอกรหัสยืนยัน Admin">
            </div>

            <!-- 5. สร้างรหัสผ่าน -->
            <div class="form-group">
                <label for="regPassword">สร้างรหัสผ่าน</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่านของคุณ" required>
                    <button type="button" class="toggle-password">แสดง</button>
                </div>
                
                <!-- รายการเงื่อนไขรหัสผ่าน 4 ข้อ -->
                <div class="password-rules">
                    <ul>
                        <li id="ruleLength"><span class="rule-icon">❌</span> จำนวนไม่น้อยกว่า 8 หลัก</li>
                        <li id="ruleUpper"><span class="rule-icon">❌</span> ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่ A - Z อย่างน้อย 1 ตัว</li>
                        <li id="ruleLower"><span class="rule-icon">❌</span> ตัวอักษรภาษาอังกฤษพิมพ์เล็ก a - z อย่างน้อย 1 ตัว</li>
                        <li id="ruleNumber"><span class="rule-icon">❌</span> ตัวเลข 0 - 9 อย่างน้อย 1 ตัว</li>
                    </ul>
                </div>
            </div>

            <!-- 6. ยืนยันรหัสผ่าน -->
            <div class="form-group">
                <label for="regConfirmPassword">ยืนยันรหัสผ่าน</label>
                <div class="password-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
                    <button type="button" class="toggle-password">แสดง</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">ยืนยันการสมัครสมาชิก</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.25rem; text-align: center;">
            <p style="font-size: 0.875rem; color: #6b7280;">มีบัญชีอยู่แล้ว? <a href="index.html" class="link-btn">เข้าสู่ระบบ</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
