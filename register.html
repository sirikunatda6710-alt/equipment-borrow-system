<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <img src="https://img2.pic.in.th/MED_logo1-1.png" alt="โลโก้คณะ">
        </div>

        <h1 class="auth-title">สมัครสมาชิก</h1>
        <p class="auth-subtitle">สร้างบัญชีผู้ใช้สำหรับระบบยืม-คืนอุปกรณ์</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="regName">ชื่อ - นามสกุล</label>
                <input type="text" id="regName" placeholder="กรอกชื่อ-นามสกุล" required>
            </div>

            <div class="form-group">
                <label for="regEmail">อีเมล</label>
                <input type="email" id="regEmail" placeholder="กรอกอีเมลของคุณ" required>
            </div>

            <div class="form-group">
                <label for="regPassword">รหัสผ่าน</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                    <button type="button" class="toggle-password">แสดง</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">ยืนยันการสมัครสมาชิก</button>
        </form>

        <div class="auth-footer" style="margin-top: 1.25rem; text-align: center;">
            <p style="font-size: 0.875rem; color: #6b7280;">มีบัญชีอยู่แล้ว? <a href="index.html" class="link-btn" style="font-weight: 600;">เข้าสู่ระบบ</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
