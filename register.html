<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ลงทะเบียน | ระบบยืม-คืนอุปกรณ์</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-container"><div class="login-logo"><img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ"></div><h1>ลงทะเบียน</h1><p class="login-subtitle">สร้างบัญชีเพื่อใช้งานระบบยืม-คืนอุปกรณ์</p><form id="registerForm" class="login-form"><label for="name">ชื่อ-นามสกุล</label><input id="name" required placeholder="กรอกชื่อ-นามสกุล"><label for="email">อีเมล</label><input id="email" type="email" required placeholder="กรอกอีเมล"><label for="password">รหัสผ่าน</label><div class="password-wrapper"><input id="password" type="password" required placeholder="สร้างรหัสผ่าน"><button type="button" class="toggle-password">แสดง</button></div><div class="password-rules"><p><b>รหัสผ่านต้องมี:</b></p><p id="ruleLength" class="rule-invalid">อย่างน้อย 8 ตัวอักษร</p><p id="ruleUppercase" class="rule-invalid">ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่</p><p id="ruleLowercase" class="rule-invalid">ตัวอักษรภาษาอังกฤษพิมพ์เล็ก</p><p id="ruleNumber" class="rule-invalid">ตัวเลขอย่างน้อย 1 ตัว</p></div><label for="confirmPassword">ยืนยันรหัสผ่าน</label><div class="password-wrapper"><input id="confirmPassword" type="password" required placeholder="กรอกอีกครั้ง"><button type="button" class="toggle-password">แสดง</button></div><button class="login-button">ลงทะเบียน</button><p class="register-link">มีบัญชีแล้ว? <a href="index.html">เข้าสู่ระบบ</a></p></form></div><script src="app.js"></script></body></html>
