<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติระบบ | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-badge-approved { background: #d1fae5; color: #059669; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; }
        .status-badge-pending { background: #fef3c7; color: #d97706; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; }
        .status-badge-rejected { background: #fee2e2; color: #dc2626; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="header-logo"><img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ"></div>
                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p id="systemRoleText">ระบบจัดการอุปกรณ์</p>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" id="profileButton" class="profile-button">
                    <i data-lucide="circle-user-round"></i>
                    <div class="profile-info">
                        <span class="profile-label" id="userRoleBadge">ผู้ดูแลระบบ</span>
                        <span id="userName" class="profile-name">ผู้ใช้งาน</span>
                    </div>
                </button>
                <button type="button" id="logoutButton" class="logout-button">
                    <i data-lucide="log-out"></i><span>ออกจากระบบ</span>
                </button>
            </div>
        </header>

        <!-- Navbar -->
        <nav class="navbar" id="mainNavbar"></nav>

        <!-- Main Content -->
        <main class="main-content">
            <section class="dashboard-heading">
                <h1 id="historyTitle">📜 ประวัติการทำรายการยืม-คืน</h1>
                <p>ตรวจสอบประวัติการทำรายการทั้งหมด พร้อมชื่อผู้ดูแลระบบผู้ดำเนินการอนุมัติ</p>
            </section>

            <section class="table-container" style="margin-top: 1.5rem;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>รหัสรายการ</th>
                                <th>ผู้ทำรายการ</th>
                                <th>ชื่ออุปกรณ์</th>
                                <th>ประเภทคำขอ</th>
                                <th>จำนวน</th>
                                <th>วันที่ทำรายการ</th>
                                <th>สถานะ</th>
                                <th>แอดมินผู้อนุมัติ/ดำเนินการ</th>
                            </tr>
                        </thead>
                        <tbody id="userHistoryTable"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal ข้อมูลผู้ใช้งาน -->
    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-content profile-modal">
            <button type="button" class="modal-close" id="closeProfileModal">×</button>
            <h2>ข้อมูลผู้ใช้งาน</h2>
            <div class="profile-modal-icon"><i data-lucide="circle-user-round"></i></div>
            <label for="editUserName">ชื่อผู้ใช้งาน</label>
            <input id="editUserName" placeholder="กรอกชื่อผู้ใช้งาน...">
            <button type="button" id="saveProfileButton" class="save-profile-button">บันทึกข้อมูล</button>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHistoryData();
        });

        function renderHistoryData() {
            const table = document.getElementById('userHistoryTable');
            const currentUser = JSON.parse(localStorage.getItem('equipment_current_user')) || {};
            const allRequests = JSON.parse(localStorage.getItem('user_requests')) || [];

            let displayList = [];

            // 🟢 ถ้าเป็น Admin ให้เห็นประวัติของทุกคนในระบบ
            if (currentUser.role === 'admin') {
                displayList = allRequests;
            } else {
                // 🟢 ถ้าเป็น User ให้เห็นเฉพาะรายการของตนเอง
                displayList = allRequests.filter(r => r.userEmail === currentUser.email || r.userName === currentUser.name);
            }

            if (displayList.length === 0) {
                table.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 2.5rem; color: #6b7280;">ยังไม่มีประวัติการทำรายการในระบบ</td></tr>`;
                return;
            }

            table.innerHTML = displayList.map(item => `
                <tr>
                    <td><strong>${item.id}</strong></td>
                    <td>${item.userName || item.userEmail || 'ผู้ใช้งาน'}</td>
                    <td>${item.equipmentName}</td>
                    <td><span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-size:0.8rem; font-weight:600;">${item.type || 'ยืม'}</span></td>
                    <td>${item.quantity || 1}</td>
                    <td>${item.requestDate}</td>
                    <td>
                        <span class="status-badge-${item.status}">
                            ${item.status === 'pending' ? 'รออนุมัติ' : item.status === 'approved' ? 'อนุมัติสำเร็จ' : 'ถูกปฏิเสธ'}
                        </span>
                    </td>
                    <td><strong>${item.approvedBy ? item.approvedBy : (item.status === 'pending' ? '-' : 'ผู้ดูแลระบบ')}</strong></td>
                </tr>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }
    </script>
</body>

</html>
