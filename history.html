<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ประวัติ | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- =====================================================
             Header
        ====================================================== -->

        <header class="header">

            <div class="brand">

                <div class="header-logo">
                    <img
                        src="https://img2.pic.in.th/007-med-msu.md.webp"
                        alt="โลโก้คณะ"
                    >
                </div>

                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p>ระบบจัดการอุปกรณ์</p>
                </div>

            </div>


            <div class="header-actions">

                <!-- Search -->
                <div class="header-search">
                    <i data-lucide="search"></i>
                    <input
                        id="headerSearch"
                        placeholder="ค้นหาอุปกรณ์..."
                    >
                </div>


                <!-- Notification -->
                <button
                    type="button"
                    id="notificationButton"
                    class="icon-button"
                >
                    <i data-lucide="bell"></i>

                    <span
                        id="notificationCount"
                        class="notification-badge"
                    >
                        0
                    </span>
                </button>


                <!-- Profile -->
                <button
                    type="button"
                    id="profileButton"
                    class="profile-button"
                >
                    <i data-lucide="circle-user-round"></i>

                    <div class="profile-info">

                        <span class="profile-label">
                            ผู้ใช้งาน
                        </span>

                        <span
                            id="userName"
                            class="profile-name"
                        >
                            ผู้ใช้งาน
                        </span>

                    </div>
                </button>


                <!-- Logout -->
                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    <i data-lucide="log-out"></i>
                    <span>ออกจากระบบ</span>
                </button>

            </div>

        </header>


        <!-- =====================================================
             Navigation
        ====================================================== -->

        <nav class="navbar">

            <a href="dashboard.html">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="equipment.html">
                <i data-lucide="package-search"></i>
                <span>อุปกรณ์</span>
            </a>

            <a href="borrow.html">
                <i data-lucide="clipboard-list"></i>
                <span>รายการยืม</span>
            </a>

            <a href="return.html">
                <i data-lucide="undo-2"></i>
                <span>คืนอุปกรณ์</span>
            </a>

            <a
                href="history.html"
                class="active"
            >
                <i data-lucide="history"></i>
                <span>ประวัติ</span>
            </a>

        </nav>


        <!-- =====================================================
             Main Content
        ====================================================== -->

        <main class="main-content">


            <!-- Page Heading -->

            <section class="page-heading">

                <h1>ประวัติการยืม-คืน</h1>

                <p>
                    ตรวจสอบรายการย้อนหลัง
                </p>

            </section>


            <!-- =================================================
                 History Statistics
            ================================================== -->

            <section class="stats-container">


                <!-- Total -->

                <div class="stat-card">

                    <div class="stat-icon">
                        <i data-lucide="list"></i>
                    </div>

                    <h3>ทั้งหมด</h3>

                    <p
                        id="totalHistory"
                        class="stat-number"
                    >
                        0
                    </p>

                </div>


                <!-- Borrowing -->

                <div class="stat-card">

                    <div class="stat-icon">
                        <i data-lucide="package-open"></i>
                    </div>

                    <h3>กำลังยืม</h3>

                    <p
                        id="borrowingHistory"
                        class="stat-number"
                    >
                        0
                    </p>

                </div>


                <!-- Returned -->

                <div class="stat-card">

                    <div class="stat-icon">
                        <i data-lucide="circle-check"></i>
                    </div>

                    <h3>คืนแล้ว</h3>

                    <p
                        id="returnedHistory"
                        class="stat-number"
                    >
                        0
                    </p>

                </div>


                <!-- Overdue -->

                <div class="stat-card unavailable-card">

                    <div class="stat-icon">
                        <i data-lucide="triangle-alert"></i>
                    </div>

                    <h3>เกินกำหนด</h3>

                    <p
                        id="overdueHistory"
                        class="stat-number"
                    >
                        0
                    </p>

                </div>

            </section>


            <!-- =================================================
                 History Table
            ================================================== -->

            <section class="table-container">


                <!-- Search + Filter -->

                <div class="page-toolbar">

                    <div
                        class="table-search"
                        style="margin: 0; flex: 1;"
                    >

                        <i data-lucide="search"></i>

                        <input
                            id="historySearch"
                            placeholder="ค้นหารายการ..."
                        >

                    </div>


                    <select id="statusFilter">

                        <option value="all">
                            ทุกสถานะ
                        </option>

                        <option value="borrowing">
                            กำลังยืม
                        </option>

                        <option value="returned">
                            คืนแล้ว
                        </option>

                        <option value="overdue">
                            เกินกำหนด
                        </option>

                    </select>

                </div>


                <!-- Table -->

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>เลขที่</th>

                                <th>อุปกรณ์</th>

                                <th>ผู้ยืม</th>

                                <th>วันที่ยืม</th>

                                <th>กำหนดคืน</th>

                                <th>วันที่คืนจริง</th>

                                <th>สถานะ</th>

                                <th>รายละเอียด</th>

                            </tr>

                        </thead>


                        <tbody id="historyTable">

                        </tbody>

                    </table>

                </div>


                <!-- Empty State -->

                <div
                    id="emptyHistory"
                    class="empty-state"
                    style="display: none;"
                >
                    ไม่พบข้อมูล
                </div>

            </section>


            <!-- =================================================
                 History Detail Modal
            ================================================== -->

            <div
                id="historyModal"
                class="modal"
            >

                <div class="modal-content">

                    <button
                        type="button"
                        class="modal-close"
                        id="closeHistoryModal"
                    >
                        ×
                    </button>

                    <h2>
                        รายละเอียดรายการ
                    </h2>

                    <div id="historyModalContent">

                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- =====================================================
         Profile Modal
    ====================================================== -->

    <div
        id="profileModal"
        class="modal"
    >

        <div class="modal-content profile-modal">

            <button
                type="button"
                class="modal-close"
                id="closeProfileModal"
            >
                ×
            </button>


            <h2>
                ข้อมูลผู้ใช้งาน
            </h2>


            <div class="profile-modal-icon">
                <i data-lucide="circle-user-round"></i>
            </div>


            <label for="editUserName">
                ชื่อผู้ใช้งาน
            </label>

            <input id="editUserName">


            <button
                type="button"
                id="saveProfileButton"
                class="save-profile-button"
            >
                บันทึกข้อมูล
            </button>

        </div>

    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="app.js"></script>

</body>

</html>
