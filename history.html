<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติระบบ | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="header-logo">
                    <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
                </div>
                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p id="systemRoleText">ส่วนผู้ดูแลระบบ (Admin)</p>
                </div>
            </div>

            <div class="header-actions">
                <button type="button" id="profileButton" class="profile-button">
                    <i data-lucide="circle-user-round"></i>
                    <div class="profile-info">
                        <span class="profile-label" id="userRoleBadge">ผู้ดูแลระบบ</span>
                        <span id="userName" class="profile-name">ผู้ดูแลระบบ</span>
                    </div>
                </button>

                <button type="button" id="logoutButton" class="logout-button">
                    <i data-lucide="log-out"></i>
                    <span>ออกจากระบบ</span>
                </button>
            </div>
        </header>

        <!-- Navbar -->
        <nav class="navbar" id="mainNavbar"></nav>

        <!-- Main Content -->
        <main class="main-content">
            <section class="dashboard-heading" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1>📜 ประวัติการใช้งานระบบ</h1>
                    <p>บันทึกประวัติการจัดการอุปกรณ์ การอนุมัติยืม-คืน และการอนุมัติผู้ใช้งาน</p>
                </div>
                <button onclick="clearHistoryLog()" style="padding: 0.5rem 1rem; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
                    ล้างประวัติทั้งหมด
                </button>
            </section>

            <!-- ตารางประวัติ -->
            <section class="table-container" style="margin-top: 1rem;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>วัน-เวลา</th>
                                <th>การกระทำ / กิจกรรม</th>
                                <th>รายละเอียด</th>
                                <th>ผู้ดำเนินการ (Admin)</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-content profile-modal">
            <button type="button" class="modal-close" id="closeProfileModal">×</button>
            <h2>ข้อมูลผู้ใช้งาน</h2>
            <div class="profile-modal-icon"><i data-lucide="circle-user-round"></i></div>
            <label for="editUserName">ชื่อผู้ใช้งาน</label>
            <input id="editUserName" placeholder="กรอกชื่อผู้ใช้งาน...">
            <button type="button" id="saveProfileButton" class="save-profile-button">บันทึกข้อมูล</button>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHistoryTable();
        });

        function getHistoryLogs() {
            try {
                return JSON.parse(localStorage.getItem('system_history')) || [
                    { action: 'เพิ่มอุปกรณ์ใหม่', detail: 'เพิ่มอุปกรณ์ EQ-CAM-001 (กล้อง DSLR Canon EOS 80D)', adminName: 'ภูพงศ์ ทรงศิริ', date: '27/9/2569 16:30:00' },
                    { action: 'อนุมัติคำขอ', detail: 'อนุมัติ คำขอ ยืม ชุดลำโพงเคลื่อนย้าย (1 ชิ้น) ของ สมชาย สายเรียน', adminName: 'ภูพงศ์ ทรงศิริ', date: '27/9/2569 17:10:00' }
                ];
            } catch (e) {
                return [];
            }
        }

        function renderHistoryTable() {
            const table = document.getElementById('historyTableBody');
            const logs = getHistoryLogs();

            if (logs.length === 0) {
                table.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 2.5rem; color: #6b7280;">ยังไม่มีประวัติการบันทึกกิจกรรมในระบบ</td></tr>`;
                return;
            }

            table.innerHTML = logs.map(log => `
                <tr>
                    <td style="white-space: nowrap;">${log.date}</td>
                    <td><span style="background:#f3f4f6; color:#1f2937; padding:2px 8px; border-radius:4px; font-size:0.85rem; font-weight:600;">${log.action}</span></td>
                    <td>${log.detail}</td>
                    <td><strong>${log.adminName || 'ผู้ดูแลระบบ'}</strong></td>
                </tr>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        function clearHistoryLog() {
            if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างประวัติการทำรายการทั้งหมด?')) return;
            localStorage.removeItem('system_history');
            renderHistoryTable();
        }
    </script>
</body>

</html>
