<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>เข้าสู่ระบบ | ระบบยืม-คืนอุปกรณ์</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-container"><div class="login-logo"><img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ"></div><h1>เข้าสู่ระบบ</h1><p class="login-subtitle">เข้าสู่ระบบเพื่อใช้งานระบบ</p><form id="loginForm" class="login-form"><label for="email">อีเมล</label><input id="email" type="email" placeholder="กรอกอีเมลของคุณ" required><label for="password">รหัสผ่าน</label><div class="password-wrapper"><input id="password" type="password" placeholder="กรอกรหัสผ่าน" required><button type="button" class="toggle-password">แสดง</button></div><div class="remember-row"><input id="rememberMe" type="checkbox"><label for="rememberMe" class="remember-label">จดจำอีเมล</label></div><button class="login-button">เข้าสู่ระบบ</button><p class="forgot-link"><a href="forgot-password.html">ลืมรหัสผ่าน?</a></p><p class="register-link">ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a></p></form></div><script src="app.js"></script></body></html>
