<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LOGO -->
        <div class="login-logo">
            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >
        </div>


        <!-- TITLE -->
        <h1>เข้าสู่ระบบ</h1>

        <p class="login-subtitle">
            เข้าสู่ระบบเพื่อใช้งานระบบยืม-คืนอุปกรณ์
        </p>


        <!-- LOGIN FORM -->
        <form
            id="loginForm"
            class="login-form"
        >

            <!-- ประเภทผู้ใช้งาน -->
            <div class="form-group">
  <label for="loginRole">
    ประเภทผู้ใช้งาน
  </label>

  <select id="loginRole" name="role">
    <option value="user">
      ผู้ใช้งานทั่วไป
    </option>

    <option value="admin">
      ผู้ดูแลระบบ
    </option>
  </select>
</div>

<div
  id="adminCodeGroup"
  class="form-group"
  style="display: none;"
>
  <label for="adminCode">
    รหัสผู้ดูแลระบบ
  </label>

  <div class="password-wrapper">

    <input
      type="password"
      id="adminCode"
      name="adminCode"
      inputmode="numeric"
      maxlength="5"
      autocomplete="off"
      placeholder="กรอกรหัส 5 หลัก"
    >

    <button
      type="button"
      class="toggle-password"
      data-target="adminCode"
    >
      แสดง
    </button>

  </div>
</div>

                <small
                    style="
                        display: block;
                        margin-top: 6px;
                        color: #666;
                        font-size: 13px;
                    "
                >
                    สำหรับผู้ดูแลระบบเท่านั้น
                </small>

            </div>


            <!-- REMEMBER -->
            <div class="remember-row">

                <input
                    id="rememberMe"
                    name="rememberMe"
                    type="checkbox"
                >

                <label
                    for="rememberMe"
                    class="remember-label"
                >
                    จดจำรหัสผ่านและอีเมลของฉัน
                </label>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-button"
            >
                เข้าสู่ระบบ
            </button>


            <!-- FORGOT PASSWORD -->
            <p class="forgot-link">

                <a href="forgot-password.html">
                    ลืมรหัสผ่าน?
                </a>

            </p>


            <!-- REGISTER -->
            <p class="register-link">

                ยังไม่มีบัญชี?
                <a href="register.html">
                    ลงทะเบียน
                </a>

            </p>

        </form>

    </div>


    <!-- APP JS -->
    <script src="app.js"></script>

</body>
</html>
