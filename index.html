<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>เข้าสู่ระบบ | ระบบยืม-คืนอุปกรณ์</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">

    <div class="login-container">

        <!-- โลโก้ -->
        <div class="logo">

            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >

        </div>


        <!-- หัวข้อ -->
        <h1>ระบบยืม-คืนอุปกรณ์</h1>

        <p class="subtitle">
            กรุณาเข้าสู่ระบบเพื่อใช้งาน
        </p>


        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="loginForm" class="login-form">


            <!-- อีเมล -->
            <label for="email">
                อีเมล
            </label>

            <input
                type="email"
                id="email"
                placeholder="กรอกอีเมลของคุณ"
                required
            >


            <!-- รหัสผ่าน -->
            <label for="password">
                รหัสผ่าน
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >
                    แสดง
                </button>

            </div>
            


            <!-- ลืมรหัสผ่าน -->
            <div class="forgot-password">

                <a href="forgot-password.html">
                    ลืมรหัสผ่าน?
                </a>

            </div>


            <!-- จดจำข้อมูล -->
            <label class="remember-label">

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                <span>
                    จดจำอีเมลและรหัสผ่าน
                </span>

            </label>


            <!-- ปุ่มเข้าสู่ระบบ -->
            <button
                type="submit"
                class="login-button"
            >
                เข้าสู่ระบบ
            </button>


            <!-- ลิงก์สมัครสมาชิก -->
            <p class="register-link">

                ยังไม่มีบัญชี?

                <a href="register.html">
                    ลงทะเบียน
                </a>

            </p>


        </form>

    </div>


    <!-- เชื่อมต่อ JavaScript -->
    <script src="app.js"></script>
<link rel="stylesheet" href="style.css">
</body>

</html>
