<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- โลโก้ -->
        <div class="login-logo">
            <img
                src="https://img2.pic.in.th/007-med-msu.md.webp"
                alt="โลโก้คณะ"
            >
        </div>

        <!-- หัวข้อ -->
        <h1>เข้าสู่ระบบ</h1>

        <p class="login-subtitle">
            เข้าสู่ระบบเพื่อใช้งานระบบ
        </p>

        <!-- แบบฟอร์มเข้าสู่ระบบ -->
        <form id="loginForm" class="login-form">

            <!-- ประเภทผู้ใช้งาน -->
            <div class="form-group">

                <label for="loginRole">
                    ประเภทผู้ใช้งาน
                </label>

                <select id="loginRole">

                    <option value="user">
                        ผู้ใช้งานทั่วไป
                    </option>

                    <option value="admin">
                        ผู้ดูแลระบบ
                    </option>

                </select>

            </div>

            <!-- อีเมล -->
            <label for="email">
                อีเมล
            </label>

            <input
                id="email"
                type="email"
                placeholder="กรอกอีเมลของคุณ"
                required
            >

            <!-- รหัสผ่าน -->
            <label for="password">
                รหัสผ่าน
            </label>

            <div class="password-wrapper">

                <input
                    id="password"
                    type="password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="password"
                >
                    แสดง
                </button>

            </div>

            <!-- รหัสผู้ดูแลระบบ -->
            <div
                class="form-group"
                id="adminCodeGroup"
                style="display: none;"
            >

                <label for="adminCode">
                    รหัสผู้ดูแลระบบ
                </label>

                <input
                    id="adminCode"
                    type="password"
                    inputmode="numeric"
                    maxlength="5"
                    placeholder="กรอกรหัสผู้ดูแล 5 หลัก"
                >

            </div>

            <!-- จดจำอีเมลและรหัสผ่าน -->
            <div class="remember-row">

                <input
                    id="rememberMe"
                    type="checkbox"
                >

                <label
                    for="rememberMe"
                    class="remember-label"
                >
                    จดจำรหัสผ่านและอีเมลของฉัน
                </label>

            </div>

            <!-- ปุ่มเข้าสู่ระบบ -->
            <button
                type="submit"
                class="login-button"
            >
                เข้าสู่ระบบ
            </button>

            <!-- ลืมรหัสผ่าน -->
            <p class="forgot-link">

                <a href="forgot-password.html">
                    ลืมรหัสผ่าน?
                </a>

            </p>

            <!-- ลงทะเบียน -->
            <p class="register-link">

                ยังไม่มีบัญชี?
                
                <a href="register.html">
                    ลงทะเบียน
                </a>

            </p>

        </form>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
