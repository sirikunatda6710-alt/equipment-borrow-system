<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ" class="login-logo">
                <h2>เข้าสู่ระบบ</h2>
                <p>เข้าสู่ระบบเพื่อใช้งานระบบยืม-คืนอุปกรณ์</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" required placeholder="กรอกอีเมลของคุณ...">
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="กรอกรหัสผ่าน...">
                        <button type="button" class="toggle-password">แสดง</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>จดจำรหัสผ่านและอีเมลของฉัน</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>

                <div class="form-footer">
                    <a href="forgot-password.html">ลืมรหัสผ่าน?</a>
                    <p>ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
