<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        อุปกรณ์ | ระบบยืม-คืนอุปกรณ์
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- Lucide Icons -->

    <script
        src="https://unpkg.com/lucide@latest"
    ></script>


</head>


<body>


    <div class="app-container">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">


            <!-- โลโก้และชื่อระบบ -->

            <div class="brand">


                <div class="header-logo">

                    <img
                        src="https://img2.pic.in.th/007-med-msu.md.webp"
                        alt="โลโก้คณะ"
                    >

                </div>


                <div class="brand-text">

                    <h2>
                        ระบบยืม-คืนอุปกรณ์
                    </h2>

                    <p>
                        ระบบจัดการอุปกรณ์
                    </p>

                </div>


            </div>



            <!-- เมนูด้านขวา -->

            <div class="header-actions">


                <!-- ค้นหา -->

                <div class="header-search">

                    <i
                        data-lucide="search"
                    ></i>


                    <input
                        type="text"
                        id="headerSearch"
                        placeholder="ค้นหาอุปกรณ์..."
                    >

                </div>



                <!-- การแจ้งเตือน -->

                <button
                    type="button"
                    id="notificationButton"
                    class="icon-button notification-button"
                >

                    <i
                        data-lucide="bell"
                    ></i>


                    <span
                        id="notificationCount"
                        class="notification-badge"
                    >
                        0
                    </span>

                </button>



                <!-- โปรไฟล์ -->

                <button
                    type="button"
                    id="profileButton"
                    class="profile-button"
                >

                    <i
                        data-lucide="circle-user-round"
                    ></i>


                    <div class="profile-info">

                        <span class="profile-label">
                            ผู้ใช้งาน
                        </span>


                        <span
                            id="userName"
                            class="profile-name"
                        >
                            ผู้ใช้งาน
                        </span>

                    </div>

                </button>



                <!-- ออกจากระบบ -->

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >

                    <i
                        data-lucide="log-out"
                    ></i>


                    <span>
                        ออกจากระบบ
                    </span>

                </button>


            </div>


        </header>



        <!-- =========================
             NAVIGATION
        ========================== -->

        <nav class="navbar">


            <a href="dashboard.html">

                <i
                    data-lucide="layout-dashboard"
                ></i>

                <span>
                    Dashboard
                </span>

            </a>



            <a
                href="equipment.html"
                class="active"
            >

                <i
                    data-lucide="package-search"
                ></i>

                <span>
                    อุปกรณ์
                </span>

            </a>



            <a href="borrow.html">

                <i
                    data-lucide="clipboard-list"
                ></i>

                <span>
                    รายการยืม
                </span>

            </a>



            <a href="return.html">

                <i
                    data-lucide="undo-2"
                ></i>

                <span>
                    คืนอุปกรณ์
                </span>

            </a>



            <a href="history.html">

                <i
                    data-lucide="history"
                ></i>

                <span>
                    ประวัติ
                </span>

            </a>


        </nav>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">


            <!-- หัวข้อ -->

            <section class="page-heading">


                <div>

                    <h1>
                        จัดการอุปกรณ์
                    </h1>


                    <p>
                        เพิ่ม แก้ไข และจัดการข้อมูลอุปกรณ์ภายในระบบ
                    </p>

                </div>



                <!-- ปุ่มเพิ่มอุปกรณ์ -->

                <button
                    type="button"
                    id="addEquipmentButton"
                    class="add-button"
                >

                    <i
                        data-lucide="plus"
                    ></i>

                    เพิ่มอุปกรณ์

                </button>


            </section>



            <!-- =========================
                 SEARCH
            ========================== -->

            <section class="equipment-toolbar">


                <div class="table-search">

                    <i
                        data-lucide="search"
                    ></i>


                    <input
                        type="text"
                        id="equipmentSearch"
                        placeholder="ค้นหาด้วยรหัส ชื่อ หรือประเภทอุปกรณ์..."
                    >

                </div>


            </section>



            <!-- =========================
                 EQUIPMENT TABLE
            ========================== -->

            <section class="table-container">


                <div class="table-top">


                    <div class="table-title">


                        <div class="table-title-icon">

                            <i
                                data-lucide="package"
                            ></i>

                        </div>


                        <div>

                            <h2>
                                รายการอุปกรณ์
                            </h2>


                            <p>
                                ข้อมูลอุปกรณ์ทั้งหมดในระบบ
                            </p>

                        </div>


                    </div>


                </div>



                <div class="table-responsive">


                    <table>


                        <thead>

                            <tr>

                                <th>
                                    รหัสอุปกรณ์
                                </th>


                                <th>
                                    ชื่ออุปกรณ์
                                </th>


                                <th>
                                    ประเภท
                                </th>


                                <th>
                                    สถานะ
                                </th>


                                <th>
                                    ผู้ยืม
                                </th>


                                <th>
                                    จัดการ
                                </th>

                            </tr>

                        </thead>



                        <tbody
                            id="equipmentTable"
                        >

                            <!-- JavaScript -->

                        </tbody>


                    </table>


                </div>


            </section>


        </main>


    </div>



    <!-- =========================
         MODAL เพิ่ม / แก้ไขอุปกรณ์
    ========================== -->

    <div
        id="equipmentFormModal"
        class="modal"
    >


        <div class="modal-content equipment-form-modal">


            <!-- ปิด Modal -->

            <button
                type="button"
                class="modal-close"
                id="closeEquipmentFormModal"
            >
                ×
            </button>



            <h2
                id="equipmentFormTitle"
            >
                เพิ่มอุปกรณ์
            </h2>



            <!-- FORM -->

            <form
                id="equipmentForm"
            >


                <!-- รหัสอุปกรณ์ -->

                <div class="form-group">

                    <label>
                        รหัสอุปกรณ์
                    </label>


                    <input
                        type="text"
                        id="equipmentId"
                        placeholder="เช่น EQ001"
                        required
                    >

                </div>



                <!-- ชื่ออุปกรณ์ -->

                <div class="form-group">

                    <label>
                        ชื่ออุปกรณ์
                    </label>


                    <input
                        type="text"
                        id="equipmentName"
                        placeholder="กรอกชื่ออุปกรณ์"
                        required
                    >

                </div>



                <!-- ประเภท -->

                <div class="form-group">

                    <label>
                        ประเภทอุปกรณ์
                    </label>


                    <input
                        type="text"
                        id="equipmentCategory"
                        placeholder="เช่น คอมพิวเตอร์"
                        required
                    >

                </div>



                <!-- สถานะ -->

                <div class="form-group">

                    <label>
                        สถานะ
                    </label>


                    <select
                        id="equipmentStatus"
                        required
                    >

                        <option value="พร้อมใช้งาน">
                            พร้อมใช้งาน
                        </option>


                        <option value="กำลังถูกยืม">
                            กำลังถูกยืม
                        </option>


                        <option value="ไม่พร้อมใช้งาน">
                            ไม่พร้อมใช้งาน
                        </option>

                    </select>

                </div>



                <!-- ผู้ยืม -->

                <div class="form-group">

                    <label>
                        ผู้ยืม
                    </label>


                    <input
                        type="text"
                        id="equipmentBorrower"
                        placeholder="หากไม่มีผู้ยืมให้เว้นว่าง"
                    >

                </div>



                <!-- ปุ่มบันทึก -->

                <button
                    type="submit"
                    class="save-equipment-button"
                >

                    <i
                        data-lucide="save"
                    ></i>

                    บันทึกข้อมูล

                </button>


            </form>


        </div>


    </div>



    <!-- =========================
         MODAL ดูข้อมูล
    ========================== -->

    <div
        id="equipmentModal"
        class="modal"
    >


        <div class="modal-content">


            <button
                type="button"
                class="modal-close"
                id="closeModal"
            >
                ×
            </button>


            <div id="modalContent">

                <!-- JavaScript -->

            </div>


        </div>


    </div>



    <!-- =========================
         MODAL PROFILE
    ========================== -->

    <div
        id="profileModal"
        class="modal"
    >


        <div class="modal-content profile-modal">


            <button
                type="button"
                class="modal-close"
                id="closeProfileModal"
            >
                ×
            </button>


            <h2>
                ข้อมูลผู้ใช้งาน
            </h2>



            <div class="profile-modal-icon">

                <i
                    data-lucide="circle-user-round"
                ></i>

            </div>



            <label>
                ชื่อผู้ใช้งาน
            </label>


            <input
                type="text"
                id="editUserName"
            >



            <button
                type="button"
                id="saveProfileButton"
                class="save-profile-button"
            >

                <i
                    data-lucide="save"
                ></i>

                บันทึกข้อมูล

            </button>


        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="css/js/app.js"
    ></script>


    <script>

        lucide.createIcons();

    </script>
<script src="app.js"></script>
<link rel="stylesheet" href="style.css">
</body>

</html>
