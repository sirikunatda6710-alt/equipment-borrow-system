<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>อุปกรณ์ | ระบบยืม-คืนอุปกรณ์</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- =====================================================
             Header
        ====================================================== -->

        <header class="header">

            <div class="brand">

                <div class="header-logo">
                    <img
                        src="https://img2.pic.in.th/007-med-msu.md.webp"
                        alt="โลโก้คณะ"
                    >
                </div>

                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p>ระบบจัดการอุปกรณ์</p>
                </div>

            </div>


            <div class="header-actions">

                <!-- Search -->
                <div class="header-search">

                    <i data-lucide="search"></i>

                    <input
                        id="headerSearch"
                        placeholder="ค้นหาอุปกรณ์..."
                    >

                </div>


                <!-- Notification -->
                <button
                    type="button"
                    id="notificationButton"
                    class="icon-button"
                >

                    <i data-lucide="bell"></i>

                    <span
                        id="notificationCount"
                        class="notification-badge"
                    >
                        0
                    </span>

                </button>


                <!-- Profile -->
                <button
                    type="button"
                    id="profileButton"
                    class="profile-button"
                >

                    <i data-lucide="circle-user-round"></i>

                    <div class="profile-info">

                        <span class="profile-label">
                            ผู้ใช้งาน
                        </span>

                        <span
                            id="userName"
                            class="profile-name"
                        >
                            ผู้ใช้งาน
                        </span>

                    </div>

                </button>


                <!-- Logout -->
                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >

                    <i data-lucide="log-out"></i>

                    <span>
                        ออกจากระบบ
                    </span>

                </button>

            </div>

        </header>


        <!-- =====================================================
             Navigation
        ====================================================== -->

        <nav class="navbar">

            <a href="dashboard.html">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a
                href="equipment.html"
                class="active"
            >
                <i data-lucide="package-search"></i>
                <span>อุปกรณ์</span>
            </a>

            <a href="borrow.html">
                <i data-lucide="clipboard-list"></i>
                <span>รายการยืม</span>
            </a>

            <a href="return.html">
                <i data-lucide="undo-2"></i>
                <span>คืนอุปกรณ์</span>
            </a>

            <a href="history.html">
                <i data-lucide="history"></i>
                <span>ประวัติ</span>
            </a>

        </nav>


        <!-- =====================================================
             Main Content
        ====================================================== -->

        <main class="main-content">


            <!-- Page Heading -->

            <section class="page-heading">

                <h1>อุปกรณ์</h1>

                <p>
                    จัดการข้อมูลอุปกรณ์และจำนวนคงเหลือ
                </p>

            </section>


            <!-- =================================================
                 Toolbar
            ================================================== -->

            <div class="page-toolbar">

                <!-- Search -->

                <div
                    class="table-search"
                    style="margin: 0; flex: 1;"
                >

                    <i data-lucide="search"></i>

                    <input
                        id="equipmentSearch"
                        placeholder="ค้นหารหัส ชื่อ หรือประเภท..."
                    >

                </div>


                <!-- Add Equipment -->

                <button
                    type="button"
                    id="addEquipmentButton"
                    class="primary-button"
                >
                    ＋ เพิ่มอุปกรณ์
                </button>

            </div>


            <!-- =================================================
                 Equipment Table
            ================================================== -->

            <section class="table-container">

                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>รหัส</th>

                                <th>ชื่ออุปกรณ์</th>

                                <th>ประเภท</th>

                                <th>สถานะ</th>

                                <th>ผู้ยืม</th>

                                <th>จัดการ</th>

                            </tr>

                        </thead>


                        <tbody id="equipmentTable">

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- =================================================
                 Add / Edit Equipment Modal
            ================================================== -->

            <div
                id="equipmentFormModal"
                class="modal"
            >

                <div class="modal-content">

                    <button
                        type="button"
                        class="modal-close"
                        id="closeEquipmentFormModal"
                    >
                        ×
                    </button>


                    <h2 id="equipmentFormTitle">
                        เพิ่มอุปกรณ์
                    </h2>


                    <!-- Equipment Form -->

                    <form id="equipmentForm">

                        <div class="form-grid">


                            <!-- Equipment ID -->

                            <div class="form-group">

                                <label for="equipmentId">
                                    รหัสอุปกรณ์
                                </label>

                                <input
                                    id="equipmentId"
                                    required
                                >

                            </div>


                            <!-- Equipment Name -->

                            <div class="form-group">

                                <label for="equipmentName">
                                    ชื่ออุปกรณ์
                                </label>

                                <input
                                    id="equipmentName"
                                    required
                                >

                            </div>


                            <!-- Category -->

                            <div class="form-group">

                                <label for="equipmentCategory">
                                    ประเภท
                                </label>

                                <input
                                    id="equipmentCategory"
                                    required
                                >

                            </div>


                            <!-- Status -->

                            <div class="form-group">

                                <label for="equipmentStatus">
                                    สถานะ
                                </label>

                                <select id="equipmentStatus">

                                    <option>
                                        พร้อมใช้งาน
                                    </option>

                                    <option>
                                        กำลังถูกยืม
                                    </option>

                                    <option>
                                        ไม่พร้อมใช้งาน
                                    </option>

                                </select>

                            </div>


                            <!-- Borrower -->

                            <div class="form-group">

                                <label for="equipmentBorrower">
                                    ผู้ยืม
                                </label>

                                <input
                                    id="equipmentBorrower"
                                >

                            </div>


                            <!-- Quantity -->

                            <div class="form-group">

                                <label for="equipmentQuantity">
                                    จำนวน
                                </label>

                                <input
                                    id="equipmentQuantity"
                                    type="number"
                                    min="1"
                                    value="1"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Form Actions -->

                        <div class="form-actions">

                            <button
                                type="submit"
                                class="primary-button"
                            >
                                บันทึก
                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- =================================================
                 Equipment Detail Modal
            ================================================== -->

            <div
                id="equipmentModal"
                class="modal"
            >

                <div class="modal-content">

                    <button
                        type="button"
                        class="modal-close"
                        id="closeModal"
                    >
                        ×
                    </button>

                    <div id="modalContent">

                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- =====================================================
         Profile Modal
    ====================================================== -->

    <div
        id="profileModal"
        class="modal"
    >

        <div class="modal-content profile-modal">

            <button
                type="button"
                class="modal-close"
                id="closeProfileModal"
            >
                ×
            </button>


            <h2>
                ข้อมูลผู้ใช้งาน
            </h2>


            <div class="profile-modal-icon">
                <i data-lucide="circle-user-round"></i>
            </div>


            <label for="editUserName">
                ชื่อผู้ใช้งาน
            </label>

            <input id="editUserName">


            <button
                type="button"
                id="saveProfileButton"
                class="save-profile-button"
            >
                บันทึกข้อมูล
            </button>

        </div>

    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="app.js"></script>

</body>

</html>
