<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการอุปกรณ์ | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- =====================================================
             Header
        ====================================================== -->
        <header class="header">
            <div class="brand">
                <div class="header-logo">
                    <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
                </div>
                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p>รายการสิ่งของตามประเภท</p>
                </div>
            </div>
            <div class="header-actions">
                <!-- Profile Button -->
                <button type="button" id="profileButton" class="profile-button">
                    <i data-lucide="circle-user-round"></i>
                    <div class="profile-info">
                        <span class="profile-label" id="userRoleBadge">ผู้ใช้งาน</span>
                        <span id="userName" class="profile-name">ผู้ใช้งาน</span>
                    </div>
                </button>
            </div>
        </header>

        <!-- =====================================================
             Navbar (Render Dynamic by JS based on Role)
        ====================================================== -->
        <nav class="navbar" id="mainNavbar"></nav>

        <!-- =====================================================
             Main Content
        ====================================================== -->
        <main class="main-content">
            <section class="dashboard-heading">
                <h1 id="categoryPageTitle">รายการทั้งหมด</h1>
                <p>เลือกรายการที่ต้องการเพื่อทำเรื่องขอเบิก/ยืมใช้งาน</p>
            </section>

            <!-- ตัวกรองหมวดหมู่และช่องค้นหา -->
            <div class="table-top" style="margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <div class="header-search" style="flex: 1; min-width: 250px;">
                    <i data-lucide="search"></i>
                    <input type="text" id="equipmentSearchInput" placeholder="ค้นหาชื่ออุปกรณ์ รหัส...">
                </div>
                <select id="categorySelectFilter" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #d1d5db;">
                    <option value="">ทุกประเภท</option>
                    <option value="ครุภัณฑ์">🏢 ครุภัณฑ์</option>
                    <option value="วัสดุ">📦 วัสดุ</option>
                    <option value="อุปกรณ์">🔊 อุปกรณ์ / เครื่องเสียง</option>
                </select>
            </div>

            <!-- การ์ดรายการสิ่งของ -->
            <div id="equipmentGridContainer" class="equipment-grid">
                <!-- JS จะ Render รายการการ์ดใส่ตรงนี้ -->
            </div>
        </main>
    </div>

    <!-- =====================================================
         Modal ฟอร์มยืนยันการเบิก/ยืม
    ====================================================== -->
    <div id="borrowModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 450px;">
            <button type="button" class="modal-close" onclick="closeBorrowModal()">×</button>
            <h2>แบบฟอร์มขอเบิก/ยืมอุปกรณ์</h2>
            <form id="borrowRequestForm" style="margin-top: 1rem;">
                <input type="hidden" id="modalEquipmentId">
                
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">รายการ:</label>
                    <input type="text" id="modalEquipmentName" readonly style="width: 100%; padding: 0.5rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">จำนวนที่ต้องการเบิก:</label>
                    <input type="number" id="modalBorrowQuantity" min="1" value="1" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;">
                    <small id="modalMaxAvailable" style="color: #6b7280;"></small>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">วัตถุประสงค์การใช้งาน:</label>
                    <textarea id="modalBorrowReason" rows="3" required placeholder="กรอกเหตุผลหรือกิจกรรมที่นำไปใช้..." style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
                    ยืนยันการส่งคำขอเบิก
                </button>
            </form>
        </div>
    </div>

    <!-- =====================================================
         Modal แก้ไขโปรไฟล์ผู้ใช้
    ====================================================== -->
    <div id="profileModal" class="modal" style="display: none;">
        <div class="modal-content profile-modal">
            <button type="button" class="modal-close" id="closeProfileModal">×</button>
            <h2>ข้อมูลผู้ใช้งาน</h2>
            <div class="profile-modal-icon"><i data-lucide="circle-user-round"></i></div>
            <label for="editUserName">ชื่อผู้ใช้งาน</label>
            <input id="editUserName" placeholder="กรอกชื่อผู้ใช้งาน...">
            <button type="button" id="saveProfileButton" class="save-profile-button">บันทึกข้อมูล</button>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
</body>

</html>
