<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อนุมัติยืม-คืนและสมาชิก | ระบบยืม-คืนอุปกรณ์</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab-btn {
            padding: 0.75rem 1.25rem;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn.active {
            color: #10b981;
            border-bottom-color: #10b981;
        }

        .badge-pending {
            background: #fef3c7;
            color: #d97706;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.8rem;
        }

        .badge-approved {
            background: #d1fae5;
            color: #059669;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.8rem;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #dc2626;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.8rem;
        }

        .btn-action-approve {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action-reject {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="header-logo">
                    <img src="https://img2.pic.in.th/007-med-msu.md.webp" alt="โลโก้คณะ">
                </div>
                <div class="brand-text">
                    <h2>ระบบยืม-คืนอุปกรณ์</h2>
                    <p id="systemRoleText">ส่วนผู้ดูแลระบบ (Admin)</p>
                </div>
            </div>

            <div class="header-actions">
                <button type="button" id="profileButton" class="profile-button">
                    <i data-lucide="circle-user-round"></i>
                    <div class="profile-info">
                        <span class="profile-label" id="userRoleBadge">ผู้ดูแลระบบ</span>
                        <span id="userName" class="profile-name">ผู้ดูแลระบบ</span>
                    </div>
                </button>

                <button type="button" id="logoutButton" class="logout-button">
                    <i data-lucide="log-out"></i>
                    <span>ออกจากระบบ</span>
                </button>
            </div>
        </header>

        <!-- Navbar -->
        <nav class="navbar" id="mainNavbar"></nav>

        <!-- Main Content -->
        <main class="main-content">
            <section class="dashboard-heading">
                <h1>✅ รายการรอการอนุมัติ</h1>
                <p>อนุมัติหรือปฏิเสธคำขอยืม-คืนอุปกรณ์ และการลงทะเบียนสมาชิกใหม่</p>
            </section>

            <!-- แท็บสลับหน้า -->
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" id="tabBorrowBtn" onclick="switchTab('borrow')">
                    <i data-lucide="clipboard-check"></i> คำขอยืม-คืนอุปกรณ์
                    <span id="borrowPendingBadge" class="badge-pending" style="display:none;">0</span>
                </button>
                <button type="button" class="tab-btn" id="tabUserBtn" onclick="switchTab('user')">
                    <i data-lucide="user-plus"></i> อนุมัติสมาชิกใหม่
                    <span id="userPendingBadge" class="badge-pending" style="display:none;">0</span>
                </button>
            </div>

            <!-- Content 1: อนุมัติยืม-คืน -->
            <div id="borrowApprovalSection">
                <div class="table-top" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
                    <select id="borrowStatusFilter" onchange="renderBorrowTable()" style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #d1d5db;">
                        <option value="pending">เฉพาะรายการรออนุมัติ</option>
                        <option value="all">รายการทั้งหมด</option>
                        <option value="approved">อนุมัติแล้ว</option>
                        <option value="rejected">ปฏิเสธแล้ว</option>
                    </select>
                </div>

                <section class="table-container">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>รหัสคำขอ</th>
                                    <th>ผู้ทำรายการ</th>
                                    <th>รายการอุปกรณ์</th>
                                    <th>ประเภท</th>
                                    <th>จำนวน</th>
                                    <th>เหตุผล</th>
                                    <th>วันที่ส่งคำขอ</th>
                                    <th>สถานะ</th>
                                    <th style="text-align: center;">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="borrowApprovalTable"></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Content 2: อนุมัติสมาชิก -->
            <div id="userApprovalSection" style="display: none;">
                <section class="table-container">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ชื่อ-นามสกุล</th>
                                    <th>อีเมล</th>
                                    <th>สิทธิ์ที่ขอ</th>
                                    <th>วันที่ลงทะเบียน</th>
                                    <th>สถานะ</th>
                                    <th style="text-align: center;">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="userApprovalTable"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderBorrowTable();
            renderUserTable();
        });

        function switchTab(tabName) {
            const borrowSec = document.getElementById('borrowApprovalSection');
            const userSec = document.getElementById('userApprovalSection');
            const tabBorrowBtn = document.getElementById('tabBorrowBtn');
            const tabUserBtn = document.getElementById('tabUserBtn');

            if (tabName === 'borrow') {
                borrowSec.style.display = 'block';
                userSec.style.display = 'none';
                tabBorrowBtn.classList.add('active');
                tabUserBtn.classList.remove('active');
            } else {
                borrowSec.style.display = 'none';
                userSec.style.display = 'block';
                tabBorrowBtn.classList.remove('active');
                tabUserBtn.classList.add('active');
            }
        }

        // ==========================================
        // 1. จัดการคำขอยืม-คืน
        // ==========================================
        function getBorrowRequests() {
            try {
                return JSON.parse(localStorage.getItem('user_requests')) || [];
            } catch (e) {
                return [];
            }
        }

        function renderBorrowTable() {
            const table = document.getElementById('borrowApprovalTable');
            const filter = document.getElementById('borrowStatusFilter').value;
            const requests = getBorrowRequests();

            const pendingCount = requests.filter(r => r.status === 'pending').length;
            const badge = document.getElementById('borrowPendingBadge');
            if (badge) {
                badge.textContent = pendingCount;
                badge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
            }

            const filtered = requests.filter(r => filter === 'all' || r.status === filter);

            if (filtered.length === 0) {
                table.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color: #6b7280;">ไม่พบข้อมูลคำขอ</td></tr>`;
                return;
            }

            table.innerHTML = filtered.map(r => `
                <tr>
                    <td><strong>${r.id}</strong></td>
                    <td>${r.userName}<br><small style="color:#6b7280;">${r.userEmail}</small></td>
                    <td>${r.equipmentName}</td>
                    <td><span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-size:0.8rem;">${r.type || 'ยืม'}</span></td>
                    <td>${r.quantity || 1}</td>
                    <td>${r.reason || '-'}</td>
                    <td>${r.requestDate}</td>
                    <td>
                        <span class="badge-${r.status}">
                            ${r.status === 'pending' ? 'รออนุมัติ' : r.status === 'approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธแล้ว'}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        ${r.status === 'pending' ? `
                            <button class="btn-action-approve" onclick="processBorrowRequest('${r.id}', 'approved')">อนุมัติ</button>
                            <button class="btn-action-reject" onclick="processBorrowRequest('${r.id}', 'rejected')">ปฏิเสธ</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function processBorrowRequest(requestId, newStatus) {
            let requests = getBorrowRequests();
            const idx = requests.findIndex(r => r.id === requestId);
            if (idx === -1) return;

            const req = requests[idx];
            req.status = newStatus;

            // หากอนุมัติยืม ให้ตัดจำนวนอุปกรณ์คงเหลือ
            if (newStatus === 'approved') {
                let eqList = JSON.parse(localStorage.getItem('equipment')) || [];
                const eqIdx = eqList.findIndex(e => e.id === req.equipmentId || e.name === req.equipmentName);
                if (eqIdx !== -1) {
                    if (req.type === 'ยืม') {
                        eqList[eqIdx].available = Math.max(0, (eqList[eqIdx].available || 0) - (req.quantity || 1));
                    } else if (req.type === 'คืน') {
                        eqList[eqIdx].available = Math.min(eqList[eqIdx].total, (eqList[eqIdx].available || 0) + (req.quantity || 1));
                    }
                    localStorage.setItem('equipment', JSON.stringify(eqList));
                }
            }

            localStorage.setItem('user_requests', JSON.stringify(requests));

            // บันทึกลงประวัติระบบ
            addSystemHistory({
                action: newStatus === 'approved' ? 'อนุมัติคำขอ' : 'ปฏิเสธคำขอ',
                detail: `${newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ'} คำขอ ${req.type} ${req.equipmentName} (${req.quantity} ชิ้น) ของ ${req.userName}`,
                adminName: localStorage.getItem('userName') || 'ผู้ดูแลระบบ',
                date: new Date().toLocaleString('th-TH')
            });

            alert(`ทำการ ${newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ'} คำขอเรียบร้อยแล้ว`);
            renderBorrowTable();
        }

        // ==========================================
        // 2. จัดการอนุมัติสมาชิกใหม่
        // ==========================================
        function getPendingUsers() {
            try {
                return JSON.parse(localStorage.getItem('pending_users')) || [
                    { id: 'USR001', name: 'สมชาย สายเรียน', email: 'somchai@msu.ac.th', role: 'user', date: '27/09/2026', status: 'pending' },
                    { id: 'USR002', name: 'วิภาดา ใจดี', email: 'wiphada@msu.ac.th', role: 'user', date: '27/09/2026', status: 'pending' }
                ];
            } catch (e) {
                return [];
            }
        }

        function renderUserTable() {
            const table = document.getElementById('userApprovalTable');
            const users = getPendingUsers();

            const pendingCount = users.filter(u => u.status === 'pending').length;
            const badge = document.getElementById('userPendingBadge');
            if (badge) {
                badge.textContent = pendingCount;
                badge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
            }

            if (users.length === 0) {
                table.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 2rem; color: #6b7280;">ไม่มีการสมัครสมาชิกใหม่</td></tr>`;
                return;
            }

            table.innerHTML = users.map(u => `
                <tr>
                    <td><strong>${u.name}</strong></td>
                    <td>${u.email}</td>
                    <td><span style="background:#f3f4f6; padding:2px 8px; border-radius:4px; font-size:0.85rem;">${u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ผู้ใช้งานทั่วไป'}</span></td>
                    <td>${u.date}</td>
                    <td><span class="badge-${u.status}">${u.status === 'pending' ? 'รออนุมัติ' : u.status === 'approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธแล้ว'}</span></td>
                    <td style="text-align: center;">
                        ${u.status === 'pending' ? `
                            <button class="btn-action-approve" onclick="processUserRegistration('${u.id}', 'approved')">อนุมัติ</button>
                            <button class="btn-action-reject" onclick="processUserRegistration('${u.id}', 'rejected')">ปฏิเสธ</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function processUserRegistration(userId, newStatus) {
            let users = getPendingUsers();
            const idx = users.findIndex(u => u.id === userId);
            if (idx === -1) return;

            const u = users[idx];
            u.status = newStatus;
            localStorage.setItem('pending_users', JSON.stringify(users));

            // บันทึกลงประวัติระบบ
            addSystemHistory({
                action: newStatus === 'approved' ? 'อนุมัติสมาชิก' : 'ปฏิเสธสมาชิก',
                detail: `${newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ'} บัญชีของ ${u.name} (${u.email})`,
                adminName: localStorage.getItem('userName') || 'ผู้ดูแลระบบ',
                date: new Date().toLocaleString('th-TH')
            });

            alert(`ทำการ ${newStatus === 'approved' ? 'อนุมัติ' : 'ปฏิเสธ'} สมาชิกเรียบร้อยแล้ว`);
            renderUserTable();
        }

        // ช่วยเพิ่มประวัติลง LocalStorage
        function addSystemHistory(log) {
            try {
                let history = JSON.parse(localStorage.getItem('system_history')) || [];
                history.unshift(log);
                localStorage.setItem('system_history', JSON.stringify(history));
            } catch (e) {}
        }
    </script>
</body>

</html>
